<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Text-failure concat DexJoCo water_plant success rate sweep</title>
  <desc id="desc">Success rate rises from 50 percent at 7000 steps to 80 percent at 12000 steps.</desc>
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="70" y="34" font-family="Arial, sans-serif" font-size="18" fill="#111827">Text-failure concat rollout sweep</text>
  <text x="70" y="56" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">DexJoCo water_plant, 50 episodes/checkpoint, seed 0</text>

  <line x1="70" y1="265" x2="700" y2="265" stroke="#111827" stroke-width="1.2"/>
  <line x1="70" y1="50" x2="70" y2="265" stroke="#111827" stroke-width="1.2"/>

  <g font-family="Arial, sans-serif" font-size="11" fill="#4b5563">
    <line x1="66" y1="265" x2="70" y2="265" stroke="#111827"/>
    <text x="38" y="269">0%</text>
    <line x1="66" y1="211.25" x2="70" y2="211.25" stroke="#111827"/>
    <text x="32" y="215">25%</text>
    <line x1="66" y1="157.5" x2="70" y2="157.5" stroke="#111827"/>
    <text x="32" y="161">50%</text>
    <line x1="66" y1="103.75" x2="70" y2="103.75" stroke="#111827"/>
    <text x="32" y="108">75%</text>
    <line x1="66" y1="50" x2="70" y2="50" stroke="#111827"/>
    <text x="26" y="54">100%</text>
  </g>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="70" y1="211.25" x2="700" y2="211.25"/>
    <line x1="70" y1="157.5" x2="700" y2="157.5"/>
    <line x1="70" y1="103.75" x2="700" y2="103.75"/>
    <line x1="70" y1="50" x2="700" y2="50"/>
  </g>

  <polyline fill="none" stroke="#2563eb" stroke-width="3" points="70,157.5 196,114.5 322,114.5 448,105.9 574,97.3 700,93"/>

  <g font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    <g fill="#2563eb">
      <circle cx="70" cy="157.5" r="5"/>
      <circle cx="196" cy="114.5" r="5"/>
      <circle cx="322" cy="114.5" r="5"/>
      <circle cx="448" cy="105.9" r="5"/>
      <circle cx="574" cy="97.3" r="5"/>
      <circle cx="700" cy="93" r="5"/>
    </g>
    <g fill="#111827">
      <text x="70" y="145">50%</text>
      <text x="196" y="102">70%</text>
      <text x="322" y="102">70%</text>
      <text x="448" y="93">74%</text>
      <text x="574" y="84">78%</text>
      <text x="700" y="80">80%</text>
    </g>
    <g fill="#4b5563">
      <text x="70" y="288">7000</text>
      <text x="196" y="288">8000</text>
      <text x="322" y="288">9000</text>
      <text x="448" y="288">10000</text>
      <text x="574" y="288">11000</text>
      <text x="700" y="288">12000</text>
    </g>
  </g>

  <text x="385" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4b5563">Checkpoint step</text>
  <text x="18" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4b5563" transform="rotate(-90 18 160)">Success rate</text>
</svg>
