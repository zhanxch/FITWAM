# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4
# Disabled preserves the legacy sampler and Accelerate DataLoader path.
# When enabled, use batch_size=4 for exactly 2 primary + 2 auxiliary samples
# on every rank. null seed reuses the global training seed.
role_balanced_sampling:
  enabled: false
  primary_per_batch: 2
  seed: null

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
# Optional periodic overrides. null preserves save_every; 0 disables periodic saves.
save_weights_every: null
# Optional exact weight-only checkpoints; null disables the explicit schedule.
# Values must be strictly increasing positive integers. The final step is always saved.
save_weight_steps: null
save_state_every: null
# null keeps all completed state checkpoints; otherwise retain the latest N from this run.
state_keep_last: null
eval_every: 50
eval_num_inference_steps: 10
eval_num_samples: 1
best_metric: val_loss
best_metric_mode: min

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null
resume_experts: null  # e.g. [video] to load only video expert weights from a .pt checkpoint

# wandb
wandb:
  enabled: false
  workspace: ${oc.env:WANDB_ENTITY,null}
  project: ${oc.env:WANDB_PROJECT,fitwam}
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
