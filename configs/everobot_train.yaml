# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null

output_dir: ./runs/everobot/${now:%Y-%m-%d}_${now:%H-%M-%S}

# EveRobot episode-level sampling (replaces frame-window sampling)
# drop_first_frames: number of leading frames to drop from each episode.
#   With drop_first_frames_random=true, the drop amount is sampled from
#   [0, drop_first_frames] each access, giving temporal augmentation.
# samples_per_episode: how many sub-clips per episode per epoch (replaces
#   DiffSynth's dataset_repeat).
drop_first_frames: 0
drop_first_frames_random: true
samples_per_episode: 1

# dataloading
batch_size: 1
num_workers: 4
# Disabled preserves the legacy sampler and Accelerate DataLoader path.
# When enabled, use batch_size=4 for exactly 2 primary + 2 auxiliary samples
# on every rank. null seed reuses the global training seed.
role_balanced_sampling:
  enabled: false
  primary_per_batch: 2
  seed: null

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 500
# Optional periodic overrides. null preserves save_every; 0 disables periodic saves.
save_weights_every: null
save_state_every: null
# null keeps all completed state checkpoints; otherwise retain the latest N from this run.
state_keep_last: null
eval_every: 500
eval_num_inference_steps: 10
eval_num_samples: 1
best_metric: val_loss
best_metric_mode: min

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16"
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null
resume_experts: null

# wandb
wandb:
  enabled: false
  workspace: ${oc.env:WANDB_ENTITY,null}
  project: ${oc.env:WANDB_PROJECT,fitwam}
  name: everobot_train
  group: everobot
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
