# @package _global_

defaults:
  - train
  - override /task: robotwin_uncond_3cam_384_1e-4
  - _self_

ckpt: null

model:
  load_text_encoder: false
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

OPENLOOP:
  split: train
  # If `episode_indices` is null, the loader iterates the first `max_samples` items
  # of the chosen split. Otherwise it restricts evaluation to the listed episode
  # positions (0-indexed within the split) and walks each episode with `frame_stride`.
  episode_indices: null
  frame_stride: 1
  max_samples: 100
  batch_size: 1
  num_workers: 0
  output_dir: ./evaluate_results/robotwin_openloop/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference.
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  seed: 42
  rand_device: cpu
  tiled: false
  device: cuda
  dataset_stats_path: null

  # Video rollout is off by default to match normal action evaluation.
  predict_video: false
  text_cfg_scale: 1.0
  negative_prompt: ""
  save_video_samples: 0
  video_fps: 8
  log_every: 10
  # Action side panel when saving videos: none | curves (default, GT vs pred vs state) | 3d (iso projection).
  video_action_panel: curves
  # Red dots on GT curve every N steps (GR00T-style). Default: full action horizon for this sample.
  video_action_inference_mark_stride: null

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
