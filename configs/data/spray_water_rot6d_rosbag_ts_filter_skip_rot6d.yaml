# C3 diagnostic: spray_water data config with rot6d dims UN-normalized (H2 fix).
#
# Baseline: configs/data/spray_water_rot6d_rosbag_ts_filter.yaml
#   (norm_default_mode: "z-score" applied uniformly to all 58 dims, aligned
#    with official FastWAM robotwin.yaml)
#
# This variant adds `norm_skip_dims` to leave the rot6d dimensions IDENTITY
# (scale=1, offset=0) while keeping z-score for xyz (dims 0:3, 9:12) and hand
# joints (dims 18:58). rot6d values already live in [-1,1] by construction, so
# they do not need rescaling; skipping normalization preserves their SO(3)
# orthonormality so the model learns on a geometrically consistent manifold.
#
# Action layout (58-dim, single "default" key):
#   [0:3]   left EEF xyz
#   [3:9]   left EEF rot6d   <- SKIP (identity)
#   [9:12]  right EEF xyz
#   [12:18] right EEF rot6d  <- SKIP (identity)
#   [18:38] left hand joints (20)
#   [38:58] right hand joints (20)
#
# Requires the normalizer patch in src/fastwam/datasets/lerobot/utils/normalizer.py
# (SingleFieldLinearNormalizer skip_dims) and the processor patch
# (FastWAMProcessor.norm_skip_dims).

train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/spray_water_rot6d_rosbag_ts_filter
  shape_meta:
    images:
      - key: head_view
        raw_shape: [3, 720, 1280]
        shape: [3, 384, 384]
      - key: left_wrist_view
        raw_shape: [3, 360, 640]
        shape: [3, 384, 384]
      - key: right_wrist_view
        raw_shape: [3, 360, 640]
        shape: [3, 384, 384]
    action:
      - key: default
        raw_shape: 58
        shape: 58
    state:
      - key: default
        raw_shape: 58
        shape: 58
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: null
  skip_padding_as_possible: true
  tolerance_s: 0.02
  video_backend: pyav
  concat_multi_camera: robotwin
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 58
    proprio_output_dim: 58

    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null
    # C3 / H2 fix: do NOT normalize rot6d dims (left 3:9, right 12:18).
    # These stay identity (scale=1, offset=0) to preserve SO(3) orthonormality.
    norm_skip_dims:
      action:
        default: [3, 4, 5, 6, 7, 8, 12, 13, 14, 15, 16, 17]
      state:
        default: [3, 4, 5, 6, 7, 8, 12, 13, 14, 15, 16, 17]

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
  text_embedding_cache_dir: ./data/text_embeds_cache/spray_water_rot6d_rosbag_ts_filter
  context_len: 128

