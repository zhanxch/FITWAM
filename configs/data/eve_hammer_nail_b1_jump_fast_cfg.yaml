# DEWO v2 CFG by Eve role. FAST is aux-only: it encodes GT action tokens and
# must not mix with action-loss (primary) samples.
# primary: outcome 0.5 / base 0.5
# aux success: outcome 0.4 / FAST 0.2 / base 0.4
# aux fail: outcome 0.0 / FAST 0.2 / base 0.4 (normalized to 0 / 1/3 / 2/3)
defaults:
  - eve_hammer_nail_b1_jump_fast
  - _self_

train:
  outcome_text_success_suffix: " Successful execution."
  outcome_text_failure_suffix: null
  outcome_text_dropout_prob: 0.0
  primary_cfg_channel_probs:
    outcome: 0.5
    fast: 0.0
    base: 0.5
  cfg_channel_probs:
    outcome: 0.4
    fast: 0.2
    base: 0.4
  failure_cfg_channel_probs:
    outcome: 0.0
    fast: 0.2
    base: 0.4
  fast_tokenizer_model_id: physical-intelligence/fast
  fast_max_tokens: 32
  fast_fail_closed: true
  text_embedding_cache_dir: ${oc.env:TEXT_EMBEDDING_CACHE_DIR,data/text_embeds_cache/hammer_nail_dewo_v2_opensource}

val:
  outcome_text_success_suffix: ${data.train.outcome_text_success_suffix}
  outcome_text_failure_suffix: null
  outcome_text_dropout_prob: 0.0
  primary_cfg_channel_probs:
    outcome: 0.0
    fast: 0.0
    base: 1.0
  cfg_channel_probs:
    outcome: 0.0
    fast: 0.0
    base: 1.0
  failure_cfg_channel_probs:
    outcome: 0.0
    fast: 0.0
    base: 1.0
  fast_tokenizer_model_id: ${data.train.fast_tokenizer_model_id}
  fast_max_tokens: ${data.train.fast_max_tokens}
  fast_fail_closed: ${data.train.fast_fail_closed}
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
