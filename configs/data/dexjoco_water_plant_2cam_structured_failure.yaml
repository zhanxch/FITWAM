train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /data_all/share/datasets/dexjoco/dexjoco_lerobot_datasets/water_plant
    - /data_all/share/FastWAM_zhaoyc_failure/artifacts/datasets/water_plant_failure_fastwam_2cam_text
  shape_meta:
    images:
      - key: front
        raw_shape: [3, 640, 640]
        shape: [3, 384, 384]
      - key: wrist
        raw_shape: [3, 640, 640]
        shape: [3, 384, 384]
    action:
      - key: default
        raw_shape: 22
        shape: 22
    state:
      - key: default
        raw_shape: 23
        shape: 23
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 768]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: /data_all/share/FastWAM_zhaoyc_failure/artifacts/dataset_stats/dexjoco_water_plant_success_action_state.json
  skip_padding_as_possible: false
  concat_multi_camera: horizontal
  action_loss_zero_if_instruction_contains: "Failed to finish the whole process."
  outcome_flag_if_instruction_contains: "Failed to finish the whole process."
  strip_instruction_suffix_if_contains: "Failed to finish the whole process."
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 22
    proprio_output_dim: 23
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: "min/max"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
  text_embedding_cache_dir: /data_all/share/FastWAM_zhaoyc_failure/artifacts/text_embeds_cache/dexjoco_water_plant_2cam_success
  context_len: 128

val:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /data_all/share/datasets/dexjoco/dexjoco_lerobot_datasets/water_plant
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  global_sample_stride: ${data.train.global_sample_stride}
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  camera_key: null
  val_set_proportion: ${data.train.val_set_proportion}
  is_training_set: false
  pretrained_norm_stats: ${data.train.pretrained_norm_stats}
  skip_padding_as_possible: false
  concat_multi_camera: ${data.train.concat_multi_camera}
  action_loss_zero_if_instruction_contains: ${data.train.action_loss_zero_if_instruction_contains}
  outcome_flag_if_instruction_contains: ${data.train.outcome_flag_if_instruction_contains}
  strip_instruction_suffix_if_contains: ${data.train.strip_instruction_suffix_if_contains}
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: ${data.train.processor.num_output_cameras}
    action_output_dim: ${data.train.processor.action_output_dim}
    proprio_output_dim: ${data.train.processor.proprio_output_dim}
    action_state_transforms: null
    use_stepwise_action_norm: ${data.train.processor.use_stepwise_action_norm}
    norm_default_mode: ${data.train.processor.norm_default_mode}
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms: ${data.train.processor.train_transforms}
    val_transforms: ${data.train.processor.val_transforms}
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: ${data.train.context_len}
