# GR00T-style (Baseline B) data config for filtered_out holdout episodes.
# Same processor/stats as spray_water_rot6d_gr00tstyle.yaml; only dataset path differs.
# is_training_set=false so open-loop eval keeps raw absolute gt_action for plotting.

train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/spray_water_rot6d_rosbag_ts_filter/filtered_out
  shape_meta:
    images:
      - key: head_view
        raw_shape: [3, 720, 1280]
        shape: [3, 384, 384]
      - key: left_wrist_view
        raw_shape: [3, 360, 640]
        shape: [3, 384, 384]
      - key: right_wrist_view
        raw_shape: [3, 360, 640]
        shape: [3, 384, 384]
    action:
      - key: left_eef
        raw_shape: 9
        shape: 9
      - key: right_eef
        raw_shape: 9
        shape: 9
      - key: left_hand_joints
        raw_shape: 20
        shape: 20
      - key: right_hand_joints
        raw_shape: 20
        shape: 20
    state:
      - key: left_eef
        raw_shape: 9
        shape: 9
      - key: right_eef
        raw_shape: 9
        shape: 9
      - key: left_hand_joints
        raw_shape: 20
        shape: 20
      - key: right_hand_joints
        raw_shape: 20
        shape: 20
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: false
  pretrained_norm_stats: null
  skip_padding_as_possible: true
  tolerance_s: 0.02
  video_backend: pyav
  concat_multi_camera: robotwin
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 58
    proprio_output_dim: 58
    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativePoseRot6dTransform
        keys: [left_eef, right_eef]
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativeJointTransformLastFrame
        keys: [left_hand_joints, right_hand_joints]
    use_stepwise_action_norm: false
    norm_default_mode: "min/max"
    norm_exception_mode: null
    norm_clip_to_unit: true
    norm_stats_source: "meta"
    norm_stats_meta_dir: ./data/spray_water_rot6d_rosbag_ts_filter/meta
    norm_relative_action_keys: [left_eef, right_eef]
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
  text_embedding_cache_dir: ./data/text_embeds_cache/spray_water_rot6d_rosbag_ts_filter
  context_len: 128

