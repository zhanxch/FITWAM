train:
  _target_: fastwam.datasets.lerobot.robot_video_episode_dataset.RobotVideoEpisodeDataset
  dataset_dirs:
    - ./data/ego_vla_short_allinone
  shape_meta:
    images:
      - key: camera_0
        raw_shape: [3, 384, 384]
        shape: [3, 384, 384]
    action:
      - key: default
        raw_shape: 50
        shape: 50
    state:
      - key: default
        raw_shape: 50
        shape: 50
  num_frames: 33
  action_stride: 10
  action_video_freq_ratio: 1
  left_pad: true
  video_size: [384, 384]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: null
  concat_multi_camera: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 50
    proprio_output_dim: 50

    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
  text_embedding_cache_dir: ./data/text_embeds_cache/ego_vla_short
  context_len: 128

