# Fold-glasses DEWO v2 (opensource-aligned):
# expert success primary mixed with recoverability pair success events;
# aux = pair success (no action) + pair failure (no action).
# MUST match FastWAM-infer-in-DexJoco: 224×224, z-score, OPEN artifacts stats.
train:
  _target_: fastwam.datasets.eve.manifest_dataset.EveManifestRobotVideoDataset
  manifest_path: ${oc.env:EVE_MANIFEST_PATH}
  manifest_splits: [train]
  dataset_dirs:
    - ${oc.env:BASE_DATASET,data/dexjoco/dexjoco_lerobot_datasets/fold_glasses}
    - ${oc.env:ROLLOUT_RAW}
  shape_meta:
    images:
      - key: front
        raw_shape: [3, 640, 640]
        shape: [3, 224, 224]
      - key: wrist
        raw_shape: [3, 640, 640]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 22
        shape: 22
    state:
      - key: default
        raw_shape: 23
        shape: 23
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  # Opensource release stats (global_mean/std → z-score). Do NOT use local meta min/max.
  pretrained_norm_stats: ${oc.env:PRETRAINED_NORM_STATS,/data_all/xiangchengzhan/FastWAM-infer-in-DexJoco/artifacts/fold_glasses/dataset_stats.json}
  skip_padding_as_possible: false
  concat_multi_camera: horizontal
  video_backend: pyav
  action_loss_zero_if_instruction_contains: null
  outcome_flag_if_instruction_contains: null
  strip_instruction_suffix_if_contains: "Failed to finish the whole process."
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 22
    proprio_output_dim: 23
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: z-score
    norm_exception_mode: null
    # Force pretrained OPEN stats path (not local meta min/max).
    norm_stats_source: pretrained
    norm_stats_meta_dir: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ${oc.env:TEXT_EMBEDDING_CACHE_DIR,data/text_embeds_cache/fold_glasses_dewo_v2_opensource}
  context_len: 128
  vae_latent_cache_dir: ${oc.env:VAE_LATENT_CACHE_DIR,null}
  require_vae_latent_cache: ${oc.env:REQUIRE_VAE_LATENT_CACHE,false}
  drop_video_when_latents_cached: true

val:
  _target_: fastwam.datasets.eve.manifest_dataset.EveManifestRobotVideoDataset
  manifest_path: ${oc.env:EVE_VAL_MANIFEST_PATH}
  manifest_splits: [val]
  dataset_dirs: ${data.train.dataset_dirs}
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  global_sample_stride: ${data.train.global_sample_stride}
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: false
  pretrained_norm_stats: ${data.train.pretrained_norm_stats}
  skip_padding_as_possible: ${data.train.skip_padding_as_possible}
  concat_multi_camera: ${data.train.concat_multi_camera}
  video_backend: ${data.train.video_backend}
  action_loss_zero_if_instruction_contains: null
  outcome_flag_if_instruction_contains: null
  strip_instruction_suffix_if_contains: ${data.train.strip_instruction_suffix_if_contains}
  processor: ${data.train.processor}
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: ${data.train.context_len}
  vae_latent_cache_dir: ${data.train.vae_latent_cache_dir}
  require_vae_latent_cache: ${data.train.require_vae_latent_cache}
  drop_video_when_latents_cached: ${data.train.drop_video_when_latents_cached}
