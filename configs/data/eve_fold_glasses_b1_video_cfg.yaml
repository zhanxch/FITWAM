# B1-video-cfg: fold-glasses B1-video data + success/failure outcome CFG.
defaults:
  - eve_fold_glasses_b1_video
  - _self_

train:
  outcome_text_success_suffix: " Successful execution."
  outcome_text_failure_suffix: " Failed execution."
  outcome_text_dropout_prob: 0.5
  text_embedding_cache_dir: ${oc.env:TEXT_EMBEDDING_CACHE_DIR,data/text_embeds_cache/fold_glasses}

val:
  outcome_text_success_suffix: ${data.train.outcome_text_success_suffix}
  outcome_text_failure_suffix: ${data.train.outcome_text_failure_suffix}
  outcome_text_dropout_prob: 0.0
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
