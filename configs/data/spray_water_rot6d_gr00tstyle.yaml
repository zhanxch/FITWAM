# Baseline B: GR00T-style data processing + FastWAM model.
#
# Mirrors GR00T's state_action_processor.py flow, now aligned to modality.json:
#   1. Data loading slices the 58-dim parquet columns by meta/modality.json into
#      4 per-modality keys (left_eef, right_eef, left_hand_joints, right_hand_joints).
#   2. Relative action conversion per-key (SE(3) for EEF, joint diff for hand):
#      - EEF (xyz+rot6d, 9-dim): T_relative = inv(T_state[-1]) @ T_action
#      - hand joints (20-dim): action - state[-1]
#   3. Per-modality min/max normalization to [-1,1] with clip, using stats
#      loaded from meta/stats.json (sliced by modality.json) + meta/relative_stats.json
#      for the relative EEF keys. This matches GR00T's per-modality normalization.
#
# Baseline A: configs/data/spray_water_rot6d_rosbag_ts_filter.yaml
#   (absolute action, z-score, no clip, single-key, stats computed at train time)
#
# FORKED BEHAVIOR: uses per-key RelativePoseRot6dTransform / RelativeJointTransformLastFrame
# and norm_clip_to_unit + norm_stats_source=meta (fork extensions).

train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/spray_water_rot6d_rosbag_ts_filter
  shape_meta:
    images:
      - key: head_view
        raw_shape: [3, 720, 1280]
        shape: [3, 384, 384]
      - key: left_wrist_view
        raw_shape: [3, 360, 640]
        shape: [3, 384, 384]
      - key: right_wrist_view
        raw_shape: [3, 360, 640]
        shape: [3, 384, 384]
    # 4 modality keys matching meta/modality.json. BaseLerobotDataset slices the
    # merged parquet column `action` / `observation.state` using modality.json.
    action:
      - key: left_eef
        raw_shape: 9
        shape: 9
      - key: right_eef
        raw_shape: 9
        shape: 9
      - key: left_hand_joints
        raw_shape: 20
        shape: 20
      - key: right_hand_joints
        raw_shape: 20
        shape: 20
    state:
      - key: left_eef
        raw_shape: 9
        shape: 9
      - key: right_eef
        raw_shape: 9
        shape: 9
      - key: left_hand_joints
        raw_shape: 20
        shape: 20
      - key: right_hand_joints
        raw_shape: 20
        shape: 20
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: null
  skip_padding_as_possible: true
  tolerance_s: 0.02
  video_backend: pyav
  concat_multi_camera: robotwin
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 58
    proprio_output_dim: 58

    # GR00T-style per-key relative action conversion.
    # EEF keys: SE(3) relative (rot6d). Hand keys: joint diff vs state[-1].
    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativePoseRot6dTransform
        keys: [left_eef, right_eef]
      - _target_: fastwam.datasets.lerobot.transforms.relative_action.RelativeJointTransformLastFrame
        keys: [left_hand_joints, right_hand_joints]
    use_stepwise_action_norm: false
    # GR00T default: min/max normalization to [-1,1].
    norm_default_mode: "min/max"
    norm_exception_mode: null
    # GR00T clips normalized values to [-1,1] (clip_outliers=True).
    norm_clip_to_unit: true
    # Load stats from meta/ (GR00T-style) instead of computing at train time.
    norm_stats_source: "meta"
    norm_stats_meta_dir: ./data/spray_water_rot6d_rosbag_ts_filter/meta
    # EEF keys use relative-action stats from meta/relative_stats.json.
    norm_relative_action_keys: [left_eef, right_eef]

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
  text_embedding_cache_dir: ./data/text_embeds_cache/spray_water_rot6d_rosbag_ts_filter
  context_len: 128

