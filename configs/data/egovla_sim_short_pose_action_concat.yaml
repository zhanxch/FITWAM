train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/egovla_sim_short_pose
  shape_meta:
    images:
      - key: camera_0
        raw_shape: [3, 384, 384]
        shape: [3, 384, 384]
    action:
      - key: default
        raw_shape: 50
        shape: 144
    state:
      - key: default
        raw_shape: 50
        shape: 50
      - key: left_ee_pose
        raw_shape: 7
        shape: 7
      - key: right_ee_pose
        raw_shape: 7
        shape: 7
      - key: left_finger_tip_pos
        raw_shape: 15
        shape: 15
      - key: right_finger_tip_pos
        raw_shape: 15
        shape: 15
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 384]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: null
  skip_padding_as_possible: false
  concat_multi_camera: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 144
    proprio_output_dim: 94

    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.misc.ConcatStateToAction
        action_key: default
        state_keys: [default, left_ee_pose, right_ee_pose, left_finger_tip_pos, right_finger_tip_pos]
        raw_action_dim: 50
        future_state: true
        state_first: true
    use_stepwise_action_norm: false
    norm_default_mode: "min/max"
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 384]
  text_embedding_cache_dir: ./data/text_embeds_cache/egovla_sim_short_pose
  context_len: 128

