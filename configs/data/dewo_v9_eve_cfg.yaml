# DEWO v9 Eve CFG overlay. FAST is unused. train.sh also exports these.
#   D+: 0.9/0/0.1 Successful
#   D_fail: 1.0/0/0 Failed
defaults:
  - dewo_v2_eve_jump_fast
  - _self_

train:
  outcome_text_success_suffix: ${oc.env:CFG_SUCCESS_SUFFIX, Successful execution.}
  outcome_text_failure_suffix: ${oc.env:CFG_FAILURE_SUFFIX, Failed execution.}
  outcome_text_dropout_prob: ${oc.decode:${oc.env:CFG_DROPOUT,0.0}}
  primary_cfg_channel_probs:
    outcome: ${oc.decode:${oc.env:CFG_PRIMARY_OUTCOME,0.9}}
    fast: ${oc.decode:${oc.env:CFG_PRIMARY_FAST,0.0}}
    base: ${oc.decode:${oc.env:CFG_PRIMARY_BASE,0.1}}
  cfg_channel_probs:
    outcome: ${oc.decode:${oc.env:CFG_AUX_SUCCESS_OUTCOME,1.0}}
    fast: ${oc.decode:${oc.env:CFG_AUX_SUCCESS_FAST,0.0}}
    base: ${oc.decode:${oc.env:CFG_AUX_SUCCESS_BASE,0.0}}
  failure_cfg_channel_probs:
    outcome: ${oc.decode:${oc.env:CFG_AUX_FAIL_OUTCOME,1.0}}
    fast: ${oc.decode:${oc.env:CFG_AUX_FAIL_FAST,0.0}}
    base: ${oc.decode:${oc.env:CFG_AUX_FAIL_BASE,0.0}}
  text_embedding_cache_dir: ${oc.env:TEXT_EMBEDDING_CACHE_DIR}

val:
  outcome_text_success_suffix: ${data.train.outcome_text_success_suffix}
  outcome_text_failure_suffix: ${data.train.outcome_text_failure_suffix}
  outcome_text_dropout_prob: 0.0
  primary_cfg_channel_probs:
    outcome: 0.0
    fast: 0.0
    base: 1.0
  cfg_channel_probs:
    outcome: 0.0
    fast: 0.0
    base: 1.0
  failure_cfg_channel_probs:
    outcome: 0.0
    fast: 0.0
    base: 1.0
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
