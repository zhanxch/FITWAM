# @package _global_

defaults:
  - train
  - override /task: robotwin_uncond_3cam_384_1e-4
  - _self_

ckpt: null

model:
  load_text_encoder: false
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

OPENLOOP:
  split: train
  # If `episode_indices` is null, the loader iterates the first `max_samples` items
  # of the chosen split. Otherwise it restricts evaluation to the listed episode
  # positions (0-indexed within the split) and walks each episode with `frame_stride`.
  episode_indices: null
  frame_stride: 1
  max_samples: 100
  batch_size: 1
  num_workers: 0
  output_dir: ./evaluate_results/openloop/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference.
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  seed: 42
  rand_device: cpu
  tiled: false
  device: cuda
  dataset_stats_path: null

  # Video rollout is off by default to match normal action evaluation.
  predict_video: false
  text_cfg_scale: 1.0
  negative_prompt: ""
  save_video_samples: 0
  # When true (requires predict_video + episode_indices), stitch rollout chunks into one GT|pred mp4 per episode.
  save_episode_video: false
  # When true (requires episode_indices), save one raw GT vs pred plot per action dimension for the full episode.
  save_episode_action_dim_plots: false
  # Skip the conditioning frame when appending later rollout chunks to avoid duplicate frames.
  episode_video_skip_conditioning_frame: true
  # Rollout mode: gt_window = GT first frame every replan (optimistic open-loop);
  # autoregressive = only the first replan uses GT image, later replans use the previous chunk's last predicted frame.
  rollout_mode: gt_window
  # Deprecated alias kept for old overrides. If set, code maps it to rollout_mode when rollout_mode is absent.
  video_obs_source: null
  # Video action conditioning: gt = oracle action (default); pred = infer_action output conditions video DiT.
  video_action_source: gt
  video_fps: 8
  log_every: 10
  # Action side panel when saving videos: none | curves (default, GT vs pred vs state) | 3d (iso projection).
  video_action_panel: curves
  # Red dots on GT curve every N steps (GR00T-style). Default: full action horizon for this sample.
  video_action_inference_mark_stride: null

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
