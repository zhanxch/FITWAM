# @package _global_
# Fold-glasses DEWO v2 on the **opensource** stack (checkpoints/dexjoco):
# width-jump events + success/FAST/base CFG + Video LoRA.
# Data: 224×224, z-score, OPEN artifacts/dataset_stats.json.
#
# Continuation defaults: lr=3e-5, max_steps=15000, save every 2500, val-best.

defaults:
  - override /data: eve_fold_glasses_b1_jump_fast_cfg
  - override /model: fastwam_video_lora
  - _self_

output_dir: ./runs/dexjoco_fold_glasses_offline_self_improving/${oc.env:RUN_ID}

batch_size: 4
num_workers: 4
role_balanced_sampling:
  enabled: true
  primary_per_batch: 2
  seed: ${seed}

model:
  # Train-time fill: load VAE, use cache hits, encode+save misses.
  load_vae: true
  fill_vae_latent_cache: true
  vae_latent_cache_dir: ${oc.env:VAE_LATENT_CACHE_DIR,null}
  proprio_dim: ${data.train.processor.proprio_output_dim}
  state_dit_config: null
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null
  video_lora:
    enabled: true
    rank: 32
    alpha: 32
    target_modules:
      - self_attn.q
      - self_attn.k
      - self_attn.v
      - self_attn.o
      - ffn.0
      - ffn.2
    checkpoint: null

lr_scheduler_type: cosine
learning_rate: 3.0e-5
num_epochs: 100
max_steps: 15000
log_every: 10
save_every: 2500
save_weights_every: 0
save_weight_steps: [2500, 5000, 7500, 10000, 12500, 15000]
save_state_every: 2500
state_keep_last: 1
eval_every: 2500
eval_num_inference_steps: 10
eval_num_samples: 8
eval_seed: 20260812
best_metric: val_base_loss
best_metric_mode: min

gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: ${oc.env:FASTWAM_RESUME}
resume_experts: null

experiment_provenance:
  protocol: fold_glasses_dewo_v2_jump_fast_lora_opensource
  variant: ${oc.env:FITWAM_VARIANT,B1-jump-fast-lora}
  stack: opensource_224_zscore
  source_checkpoint_sha256: ${oc.env:FASTWAM_RESUME_SHA256}
  source_config_sha256: ${oc.env:FASTWAM_SOURCE_CONFIG_SHA256}
  manifest_sha256: ${oc.env:EVE_MANIFEST_SHA256}
  selection_manifest_sha256: ${oc.env:EVE_VAL_MANIFEST_SHA256}
  code_snapshot_sha256: ${oc.env:FITWAM_CODE_SNAPSHOT_SHA256}
  normalization_kind: ${oc.env:NORM_STATS_SOURCE}
  normalization_bundle_sha256: ${oc.env:NORM_STATS_BUNDLE_SHA256}
  text_embedding_cache_sha256: ${oc.env:TEXT_EMBEDDING_CACHE_SHA256}

wandb:
  enabled: true
  workspace: ${oc.env:WANDB_ENTITY,null}
  project: ${oc.env:WANDB_PROJECT,fitwam}
  name: ${oc.env:WANDB_RUN_NAME}
  group: fold_glasses_dewo_v2_opensource
  mode: online
