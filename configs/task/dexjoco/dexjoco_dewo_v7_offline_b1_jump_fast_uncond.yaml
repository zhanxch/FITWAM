# @package _global_
# DEWO v7: v5 frozen-adapter shell + v6 pool, CFG residual is ε_+ − ε_-.
# One shuffle pool (no 12:4 / role-balanced):
#   D0 = success episodes (base text, video+action BC)
#   D+ = success-event primaries (Successful suffix, v5 dropout 0.9/0/0.1, action BC,
#        video identity lock; video text pinned to S0 base)
#   D_fail = failure events (Failed suffix, action BC to define ε_-, no video BC,
#        no action residual lock; video pinned to base because action BC is on)
# Mix: ε_cfg = ε_0 + w (ε_+ − ε_-). Never execute ε_-. Suffixes match v2/v5/v6.
# Weights are adapter-only (`dewo_v5_uncond_adapter_v1`, recipe=v7). INIT=s0 only.

defaults:
  - override /data: dewo_v2_eve_jump_fast_cfg
  - override /model: fastwam
  - _self_

output_dir: ${oc.env:DEWO_OUTPUT_DIR,./runs/dexjoco_dewo_v7}/${oc.env:RUN_ID}

train_mode: dewo_v7_uncond_adapter

batch_size: 16
num_workers: 4
role_balanced_sampling:
  enabled: false
  seed: ${seed}

data:
  train:
    unit_filter: dewo_v7_pool
  val:
    unit_filter: dewo_v7_pool

model:
  load_vae: false
  fill_vae_latent_cache: false
  proprio_dim: ${data.train.processor.proprio_output_dim}
  state_dit_config: null
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null
  video_dit_config:
    use_gradient_checkpointing: true
  action_dit_config:
    use_gradient_checkpointing: true
  loss:
    lambda_video: 0.0
    lambda_action: 1.0
    lambda_state: 1.0
  uncond_adapter:
    enabled: true
    rank: ${oc.decode:${oc.env:ADAPTER_RANK,16}}
    alpha: ${oc.decode:${oc.env:ADAPTER_ALPHA,16}}
    pin_video_context_to_base: true
    identity_lock_lambda: 0.1
    action_residual_lock_lambda: 0.05
    video_bc_on_zero_action: false
    recipe: v7
    target_modules:
      - cross_attn.k
      - cross_attn.v
    experts:
      - video
      - action

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 100
max_steps: 1500
log_every: 10
save_every: 500
save_weights_every: 500
save_weight_steps: []
save_state_every: 0
state_keep_last: 1
eval_every: 0
eval_num_inference_steps: 10
eval_num_samples: 8
eval_seed: 20260812
best_metric: val_base_loss
best_metric_mode: min

gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: ${oc.env:FASTWAM_RESUME}
resume_experts: null

experiment_provenance:
  protocol: ${oc.env:DEWO_PROTOCOL,dewo_v7_uncond_adapter_isolated}
  variant: ${oc.env:FITWAM_VARIANT,B1-jump-fast-v7-uncond-adapter}
  stack: opensource_224_zscore
  source_checkpoint_sha256: ${oc.env:FASTWAM_RESUME_SHA256}
  source_config_sha256: ${oc.env:FASTWAM_SOURCE_CONFIG_SHA256}
  manifest_sha256: ${oc.env:EVE_MANIFEST_SHA256}
  selection_manifest_sha256: ${oc.env:EVE_VAL_MANIFEST_SHA256}
  code_snapshot_sha256: ${oc.env:FITWAM_CODE_SNAPSHOT_SHA256}
  normalization_kind: ${oc.env:NORM_STATS_SOURCE}
  normalization_bundle_sha256: ${oc.env:NORM_STATS_BUNDLE_SHA256}
  text_embedding_cache_sha256: ${oc.env:TEXT_EMBEDDING_CACHE_SHA256}

wandb:
  enabled: true
  workspace: ${oc.env:WANDB_ENTITY,null}
  project: ${oc.env:WANDB_PROJECT,fitwam}
  name: ${oc.env:WANDB_RUN_NAME}
  group: ${oc.env:FITWAM_WANDB_GROUP,dewo_v7_opensource}
  mode: online
