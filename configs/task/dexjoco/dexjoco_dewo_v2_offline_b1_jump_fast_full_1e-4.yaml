# @package _global_
# DEWO v2 scratch (full DiT). Task/data paths come from ENV_FILE, not this file.
# Init: Wan2.2-TI2V-5B + ActionDiT linear-interp; resume=null.

defaults:
  - override /data: dewo_v2_eve_jump_fast_cfg
  - override /model: fastwam
  - _self_

output_dir: ${oc.env:DEWO_OUTPUT_DIR,./runs/dexjoco_dewo_v2}/${oc.env:RUN_ID}

batch_size: 16
num_workers: 4
role_balanced_sampling:
  enabled: true
  primary_per_batch: 8
  seed: ${seed}

model:
  # Default: online VAE (no pre-encode). Cache path: USE_VAE_LATENT_CACHE=1 + load_vae=false.
  load_vae: true
  fill_vae_latent_cache: false
  proprio_dim: ${data.train.processor.proprio_output_dim}
  state_dit_config: null
  mot_checkpoint_mixed_attn: false
  skip_dit_load_from_pretrain: false
  action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
  video_dit_config:
    use_gradient_checkpointing: true
  action_dit_config:
    use_gradient_checkpointing: true

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 100
max_steps: 15000
log_every: 10
save_every: 2500
save_weights_every: 0
save_weight_steps: [2500, 5000, 7500, 10000, 12500, 15000]
save_state_every: 2500
state_keep_last: 1
eval_every: 0
eval_num_inference_steps: 10
eval_num_samples: 8
eval_seed: 20260812
best_metric: val_base_loss
best_metric_mode: min

gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: null
resume_experts: null

experiment_provenance:
  protocol: ${oc.env:DEWO_PROTOCOL,dewo_v2_jump_fast_full_1e-4_from_scratch}
  variant: ${oc.env:FITWAM_VARIANT,B1-jump-fast-full-1e-4-scratch}
  stack: opensource_224_zscore
  source_checkpoint_sha256: ${oc.env:DEWO_SOURCE_SHA,from_scratch_wan_actiondit}
  source_config_sha256: ${oc.env:FASTWAM_SOURCE_CONFIG_SHA256}
  manifest_sha256: ${oc.env:EVE_MANIFEST_SHA256}
  selection_manifest_sha256: ${oc.env:EVE_VAL_MANIFEST_SHA256}
  code_snapshot_sha256: ${oc.env:FITWAM_CODE_SNAPSHOT_SHA256}
  normalization_kind: ${oc.env:NORM_STATS_SOURCE}
  normalization_bundle_sha256: ${oc.env:NORM_STATS_BUNDLE_SHA256}
  text_embedding_cache_sha256: ${oc.env:TEXT_EMBEDDING_CACHE_SHA256}

wandb:
  enabled: true
  workspace: ${oc.env:WANDB_ENTITY,null}
  project: ${oc.env:WANDB_PROJECT,fitwam}
  name: ${oc.env:WANDB_RUN_NAME}
  group: ${oc.env:FITWAM_WANDB_GROUP,dewo_v2_opensource}
  mode: online
