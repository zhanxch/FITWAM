# @package _global_

defaults:
  - override /data: egovla_sim_short_pose
  - override /model: fastwam
  - _self_

batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: true
  # Disable the legacy single proprio context token; pose conditioning is handled by StateDiT.
  proprio_dim: null
  state_dit_config:
    state_dim: ${data.train.processor.proprio_output_dim}
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  loss:
    lambda_action: 1.0

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 30
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 2
weight_decay: 1e-2
resume: null
