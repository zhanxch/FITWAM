# @package _global_

defaults:
  - override /data: spray_water_rot6d_rosbag_ts_filter
  - override /model: fastwam
  - _self_

batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: false
  # proprio_dim 自动从数据 config 继承（=58），与官方 robotwin 路径一致。
  # 不显式覆盖，保持官方默认行为。

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 500
eval_every: 500

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: spray_water_rot6d_rosbag_ts_filter_uncond_3cam_384_1e-4
  group: spray_water_rot6d_rosbag_ts_filter
  mode: online
