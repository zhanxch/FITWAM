# Frozen DEWO v7 inference prompts. Positive = Successful; cfg_base_prompt is
# the S0 channel (ε_0). cfg_failure_prompt is the subtractor (ε_-), never executed.
# Video stays base on all three action forwards.
env_name: water_plant
camera_mapping:
  base: front
  wrist: wrist
prompt: "Grasp the watering can and apply water to the plant. Successful execution."
cfg_base_prompt: "Grasp the watering can and apply water to the plant."
cfg_failure_prompt: "Grasp the watering can and apply water to the plant. Failed execution."
robot_type: single_arm
